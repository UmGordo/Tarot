<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tarô v2 - Leitura Interativa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-maiores: #8b4fc1;
      --color-paus: #d4a574;
      --color-copas: #e74c3c;
      --color-espadas: #34495e;
      --color-ouros: #f39c12;
      --color-bg: #0f0f1e;
      --color-bg-card: #1a1a2e;
      --color-text: #e0e0e0;
      --color-text-light: #a0a0a0;
      --color-accent: #00d4ff;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      --radius: 12px;
    }

    body {
      background: linear-gradient(135deg, #0f0f1e 0%, #1a0f2e 50%, #2a0f4e 100%);
      background-attachment: fixed;
      color: var(--color-text);
      font-family: 'Segoe UI', 'Roboto', sans-serif;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 2rem 1rem;
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--color-accent);
    }

    h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, var(--color-maiores), var(--color-copas));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .subtitle {
      color: var(--color-text-light);
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      padding: 1.5rem;
      background: var(--color-bg-card);
      border-radius: var(--radius);
      margin-bottom: 2rem;
      box-shadow: var(--shadow);
    }

    .control-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    label {
      color: var(--color-text-light);
      font-weight: 600;
      font-size: 0.95rem;
    }

    input[type="number"] {
      width: 70px;
      padding: 0.6rem;
      background: var(--color-bg);
      border: 2px solid var(--color-accent);
      color: var(--color-text);
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.3s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--color-maiores);
      box-shadow: 0 0 10px rgba(139, 79, 193, 0.3);
    }

    button {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, var(--color-maiores), var(--color-copas));
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 5px 15px rgba(139, 79, 193, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(139, 79, 193, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      padding-bottom: 2rem;
    }

    .card {
      background: var(--color-bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: var(--shadow);
      border-left: 5px solid var(--color-text-light);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(0, 212, 255, 0.1);
      transition: left 0.3s;
      pointer-events: none;
    }

    .card:hover::before {
      left: 100%;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 212, 255, 0.2);
    }

    /* Cores por naipe */
    .card.maiores {
      border-left-color: var(--color-maiores);
    }

    .card.maiores .card-symbol {
      color: var(--color-maiores);
    }

    .card.paus {
      border-left-color: var(--color-paus);
    }

    .card.paus .card-symbol {
      color: var(--color-paus);
    }

    .card.copas {
      border-left-color: var(--color-copas);
    }

    .card.copas .card-symbol {
      color: var(--color-copas);
    }

    .card.espadas {
      border-left-color: var(--color-espadas);
    }

    .card.espadas .card-symbol {
      color: var(--color-espadas);
    }

    .card.ouros {
      border-left-color: var(--color-ouros);
    }

    .card.ouros .card-symbol {
      color: var(--color-ouros);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card-symbol {
      font-size: 2rem;
      flex-shrink: 0;
    }

    .card-title {
      flex: 1;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--color-text);
    }

    .card-number {
      font-size: 0.8rem;
      color: var(--color-text-light);
      background: rgba(0, 212, 255, 0.1);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
    }

    .card-description {
      color: var(--color-text-light);
      font-size: 0.9rem;
      line-height: 1.5;
      font-style: italic;
    }

    .card-suit {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 0.75rem;
      background: rgba(0, 212, 255, 0.1);
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--color-text-light);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 1.1rem;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }

      .controls {
        flex-direction: column;
      }

      .control-group {
        width: 100%;
        justify-content: center;
      }

      .cards-container {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

    function tirarCartas(qtd) {
      const n = Math.max(1, Math.min(parseInt(qtd) || 3, baralho.length));
      const arr = baralho.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr.slice(0, n);
    }

    function renderCartas() {
      const qtd = document.getElementById('qtd').value;
      const cartas = tirarCartas(qtd);
      const container = document.getElementById('cards-list');
      const emptyState = document.getElementById('empty-state');

      if (cartas.length === 0) {
        container.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      container.innerHTML = cartas
        .map(
          (c) => `
        <div class="card ${c.naipe.toLowerCase()}">
          <div class="card-header">
            <span class="card-symbol">${c.symbol}</span>
            <div style="flex: 1;">
              <div class="card-title">${c.nome}</div>
              <div class="card-number">Nº ${c.num}</div>
            </div>
          </div>
          <div class="card-description">${c.desc}</div>
          <div class="card-suit">${c.naipe}</div>
        </div>
      `
        )
        .join('');
    }
